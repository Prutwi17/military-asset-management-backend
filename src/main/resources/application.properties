server.port=${PORT:8080}

# MySQL Configuration using Environment Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/military_DB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration using Environment Variables
app.jwt.secret=${JWT_SECRET:your_jwt_secret_key_at_least_256_bits_long_for_hmac_sha256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.military.assetmanagement=INFO
logging.level.org.springframework.security=INFO
